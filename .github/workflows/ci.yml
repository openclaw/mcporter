name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build (${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: corepack enable
      - run: corepack prepare pnpm@10.34.5 --activate

      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - run: pnpm install --frozen-lockfile
      - run: pnpm --version
      - run: pnpm check
        if: matrix.os != 'macos-15'

      # Type-aware oxlint (tsgolint) crashes on macOS runners; ubuntu and windows
      # still run the full `pnpm check`, so the rule set stays enforced.
      - name: Check without type-aware oxlint
        if: matrix.os == 'macos-15'
        run: pnpm format:check && pnpm typecheck

      - name: Verify release contracts without credentials
        if: matrix.os == 'macos-15'
        run: ./scripts/test-release.sh

      - name: Verify generated schema is committed
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          pnpm generate:schema
          pnpm exec oxfmt mcporter.schema.json
          git diff --exit-code -- mcporter.schema.json

      - name: Build docs site
        if: matrix.os == 'ubuntu-latest'
        run: pnpm docs:site

      - run: pnpm build

      - name: Pack npm artifact
        if: matrix.os == 'ubuntu-latest'
        run: pnpm pack --pack-destination /tmp

      - run: pnpm test
        if: matrix.os != 'ubuntu-latest'
        env:
          FIRECRAWL_API_KEY: test
          LINEAR_API_KEY: test

      # Coverage runs on one platform only: the thresholds in vitest.config.ts are
      # platform-independent, and instrumenting all three would triple CI time for
      # no extra signal. This still runs the whole suite, so ubuntu loses nothing.
      - name: Test with coverage
        if: matrix.os == 'ubuntu-latest'
        run: pnpm test:coverage
        env:
          FIRECRAWL_API_KEY: test
          LINEAR_API_KEY: test

      - name: Summarize coverage
        if: matrix.os == 'ubuntu-latest' && always()
        shell: bash
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No coverage summary produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore
